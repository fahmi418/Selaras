[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "synth*", "eval*", "dashboard*"]

[project]
name = "selaras"
version = "1.0.0"
description = "Deteksi ketidakselarasan iuran JKN berbasis triangulasi"
requires-python = ">=3.10"
dependencies = [
    # Web & API
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4",
    "httpx>=0.27.0",
    # Bot
    "python-telegram-bot>=21.3",
    # LLM
    "google-generativeai>=0.7.0",
    # Validation & config
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    # DB
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.0",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    # ML
    "scikit-learn>=1.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "networkx>=3.3",
    # Image processing
    "pillow>=10.3.0",
    "python-magic>=0.4.27",
    # Scheduling
    "apscheduler>=3.10.4",
    # Dashboard
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    # Security
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    # Observability
    "structlog>=24.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.8",
    "mypy>=1.10.0",
    "pip-audit>=2.7.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "app/rules/tests"]
addopts = "--tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false
